body,div,p,span,a,button{font-family:'Noto Sans KR',-apple-system,sans-serif}
body{background:#f9f9f9;width:100%}
.wrap{max-width:480px;margin:0 auto;background:#f9f9f9;min-height:100vh;width:100%;padding-bottom:40px}
.hero{text-align:center;padding:2.8rem 1.5rem 2rem;background:#fff;border-bottom:2px solid #7a1530}
.hero-kicker{font-size:12px;letter-spacing:0.16em;color:#7a1530;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.hero-name{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:22px;line-height:1.45}
.hero-msg{font-size:14px;font-weight:500;color:#333;line-height:1.75;max-width:340px;margin:0 auto;word-break:keep-all}
.nowrap{white-space:nowrap}
.hl{background:linear-gradient(transparent 52%,#fff07a 52%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.hero-brand{font-size:11px;color:#999;margin-top:18px;letter-spacing:0.04em}

.step{padding:1.4rem 1rem 0}
.step-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:12px}
.step-num{width:22px;height:22px;border-radius:50%;background:#7a1530;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-hint{font-size:12px;color:#1a6fb5;font-weight:700;margin-left:auto}

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-btn{background:#fff;border:1.5px solid #ddd;border-radius:14px;padding:16px 12px;text-align:left;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:8px}
.cat-btn:hover{border-color:#e8c0c8;background:#fdf5f6}
.cat-btn .cat-icon{width:38px;height:38px;border-radius:10px;background:#f5eaec;display:flex;align-items:center;justify-content:center}
.cat-btn .cat-icon i{font-size:19px;color:#7a1530}
.cat-title{font-size:15px;font-weight:700;color:#1a1a1a}
.cat-sub{font-size:11px;color:#999;line-height:1.5}
.cat-btn.wide{grid-column:1 / -1}
.cat-tag{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;color:#7a1530;background:#f5eaec;border-radius:999px;padding:2px 8px}
.cat-btn.active{border-color:#7a1530;background:#7a1530}
.cat-btn.active .cat-icon{background:rgba(255,255,255,0.18)}
.cat-btn.active .cat-icon i,.cat-btn.active .cat-title{color:#fff}
.cat-btn.active .cat-sub{color:#f3d5dc}

.topbar-title{font-size:14px;font-weight:700;color:#1a1a1a;margin-left:auto;margin-right:auto;padding-right:52px}
.guide-text{font-size:13px;font-weight:700;color:#1a6fb5;margin:-4px 0 12px}

.type-btn:hover{border-color:#7a1530;background:#fdf5f6}
.type-icon{width:38px;height:38px;border-radius:10px;background:#f5eaec;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-icon i{font-size:18px;color:#7a1530}
.type-text{flex:1;min-width:0}
.type-btn-title{display:block;font-size:15px;font-weight:700;color:#1a1a1a}
.type-btn-sub{display:block;font-size:12px;color:#888;margin-top:2px;line-height:1.5}
.type-arrow{font-size:16px;color:#ccc}
.type-tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px;margin-bottom:6px}
.tag-blue{background:#e6f0fb;color:#1a5fa8}
.tag-red{background:#fdecea;color:#c0392b}

.home-btn i{font-size:16px}

.detail-title{font-size:16px;font-weight:700;color:#fff}

.alert-box{background:#fff1f1;border:1.5px solid #e53e3e;border-radius:10px;padding:12px 14px;margin-bottom:16px}

.deadline-sub{font-size:13px;color:#555;line-height:1.9}

.check-content{flex:1;min-width:0}
.check-content strong{font-size:13px;font-weight:700;color:#1a1a1a;display:block;line-height:1.7}
.check-note{font-size:12px;color:#888;display:block}
.sub-list{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.sub-item{font-size:12px;color:#555;line-height:1.7;padding-left:12px;position:relative}

.sub-note{font-size:12px;color:#555;line-height:1.7;padding-left:12px}
.file-btn,.video-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fdf5f6;border:1px solid #e8c0c8;border-radius:10px;text-decoration:none;margin-top:10px}

.file-btn-text,.video-btn-text{font-size:13px;font-weight:700;color:#1a1a1a}
.file-btn-sub,.video-btn-sub{font-size:11px;color:#888;margin-top:2px}
.file-btn .arrow,.video-btn .arrow{font-size:14px;color:#bbb;margin-left:auto}

.supply-items{display:flex;gap:8px}

.divider{height:1px;background:#f0f0f0;margin:16px 0}
.event-box{background:#fff;border:2px solid #7a1530;border-radius:12px;padding:16px;text-align:center}

/* ───────── 분야 묶음 ───────── */
var CATS = [
  {key:'gov', title:'공무원 · 임용', sub:'소방 · 경찰 · 국가직 · 지방직 · 군무원 · 임용', icon:'ti-building-bank', types:['fire','police','national','local','military','teacher']},
  {key:'school', title:'학교 입시', sub:'고입 · 대입 · 편입', icon:'ti-school', types:['highschool','university','transfer']},
  {key:'job', title:'기업 면접', sub:'단기속성과정 · 면접정규과정', icon:'ti-briefcase', types:['short','regular']},
  {key:'promo', title:'승진 면접', sub:'공무원 · 기업 승진 면접', icon:'ti-award', types:['promotion']}
];

/* ───────── 렌더링 ───────── */
var curCat = null, curType = null;

function catOf(type){
  for(var i=0;i<CATS.length;i++){ if(CATS[i].types.indexOf(type)>-1) return CATS[i]; }
  return null;
}

function renderCats(){
  var html='';
  CATS.forEach(function(c){
    html+='<button class="cat-btn'+(c.wide?' wide':'')+'" onclick="selectCat(\''+c.key+'\')">'
      +'<span class="cat-icon"><i class="ti '+c.icon+'"></i></span>'
      +'<span class="cat-title">'+c.title+'</span>'
      +(c.tag?'<span class="cat-tag">'+c.tag+'</span>':'')
      +'<span class="cat-sub">'+c.sub+'</span></button>';
  });
  document.getElementById('cat-grid').innerHTML=html;
}

function getCat(key){ return CATS.filter(function(c){return c.key===key;})[0]; }

function renderTypes(){
  var cat=getCat(curCat);
  if(!cat) return;
  document.getElementById('type-topbar-title').textContent=cat.title;
  var html='';
  cat.types.forEach(function(k){
    var t=TYPES[k];
    html+='<button class="type-btn" onclick="selectType(\''+k+'\')">'
      +'<span class="type-icon"><i class="ti '+t.icon+'"></i></span>'
      +'<span class="type-text">'+(t.tag?'<span class="type-tag '+t.tagClass+'">'+t.tag+'</span>':'')+'<span class="type-btn-title">'+t.title+'</span>'
      +'<span class="type-btn-sub">'+t.sub+'</span></span>'
      +'<i class="ti ti-chevron-right type-arrow"></i></button>';
  });
  document.getElementById('type-grid').innerHTML=html;
}

function fileBtns(key){
  return FILES[key].map(function(f){
    return '<a class="file-btn" href="'+f.url+'" target="_blank"><i class="ti ti-download"></i>'
      +'<div><p class="file-btn-text">'+f.label+'</p><p class="file-btn-sub">클릭하면 다운로드 됩니다</p></div>'
      +'<i class="ti ti-external-link arrow"></i></a>';
  }).join('');
}

function renderDetail(){
  var box=document.getElementById('detail');
  if(!curType){ box.innerHTML=''; return; }
  var t=TYPES[curType];
  document.getElementById('detail-topbar-title').textContent=t.title;
  var items=t.items.map(function(it,i){
    var h='<div class="check-item"><div class="check-num">'+(i+1)+'</div><div class="check-content"><strong>'+it.t+'</strong>';
    if(it.note) h+='<span class="check-note">'+it.note+'</span>';
    if(it.subs||it.subNote){
      h+='<div class="sub-list">';
      (it.subs||[]).forEach(function(s){ h+='<p class="sub-item">'+s+'</p>'; });
      if(it.subNote) h+='<p class="sub-note">'+it.subNote+'</p>';
      h+='</div>';
    }
    if(it.files) h+=fileBtns(it.files);
    return h+'</div></div>';
  }).join('');

  box.innerHTML='<div class="detail">'
   +'<div class="detail-head"><div class="d-icon"><i class="ti '+t.icon+'"></i></div>'
   +'<div><p class="detail-title">'+t.title+'</p><p class="detail-sub">'+t.sub+'</p></div></div>'
   +'<div class="detail-body">'
   +(t.alert?'<div class="alert-box"><p>'+t.alert+'</p></div>':'')
   +'<p class="sec-title"><i class="ti ti-clock"></i>자료 제출 기한</p>'
   +'<div class="deadline-box"><p class="deadline-main"><span class="yellow-ul">수업 이틀 전 오후 9시까지 메일로 보내주세요!</span></p>'
   +'<p class="deadline-sub">예) 15일 수업 → 13일 저녁 9시까지<br>당일·하루 전 예약 시 → 예약하신 당일 밤 또는 수업 4시간 전까지<br>이메일 또는 학원 카톡</p></div>'
   +'<div class="divider"></div>'
   +'<p class="sec-title"><i class="ti ti-paperclip"></i>첨부 자료 (메일 제목: 본인 이름 · hwp 파일)</p>'
   +'<div class="checklist">'+items+'</div>'
   +'<div class="divider"></div>'
   +'<p class="sec-title"><i class="ti ti-info-circle"></i>유의사항</p>'
   +'<div class="note-list">'
   +'<p class="note-item">'+t.range+'번은 가능한 범위까지만 작성해 주셔도 됩니다.</p>'
   +'<p class="note-item">작성해 주신 내용은 담당 강사가 미리 검토하여 1:1 맞춤형 수업에 반영하므로, 수업이 훨씬 효과적으로 진행됩니다.</p>'
   +'<p class="note-item">수업 중 피드백과 과제는 꼭 스스로 체크해 주세요. 수업 후 별도 안내는 어렵습니다 🙏🏻</p>'
   +'<p class="note-item">두 번째 수업부터는 담당 강사 메일로 제출해 주세요.<br><span class="red">다음 수업 전날 오후 6시까지</span><br><span class="small-gray">예) 수요일 수업 → 화요일 오후 6시까지</span><br><span class="small-gray">바로 다음날이 수업인 경우 → 강사님이 정해준 기한 내 제출</span></p>'
   +'<p class="note-item">메일 계정 변경 시 소통이 누락될 수 있으니 동일한 계정을 사용해 주세요 :)<br>부득이하게 변경할 경우 메일 본문에 변경 사실을 꼭 기재해 주세요!</p>'
   +'</div>'
   +'<div class="divider"></div>'
   +'<p class="sec-title"><i class="ti ti-video"></i>메일 첨부 방법</p>'
   +'<a class="video-btn" href="https://www.youtube.com/shorts/_za4NnQphC8" target="_blank"><i class="ti ti-player-play"></i>'
   +'<div><p class="video-btn-text">메일 첨부 방법 영상 보기</p><p class="video-btn-sub">클릭하면 유튜브로 이동해요</p></div><i class="ti ti-external-link arrow"></i></a>'
   +'<div class="divider"></div>'
   +'<p class="sec-title"><i class="ti ti-device-laptop"></i>수업 준비물</p>'
   +'<div class="supply-box">'
   +(t.supplyAlert?'<p class="supply-alert">'+t.supplyAlert+'</p>':'')

   +'<p class="supply-note">셋 중 하나를 꼭 지참해 주세요.<br>가능하시면 노트북이나 패드를 추천드립니다 😊</p></div>'

   +'<div class="event-box"><div class="event-icon">☕</div><p class="event-title">아르떼 합격 이벤트 🎉</p>'
   +'<p class="event-desc">학원으로 카톡 주시면<br>커피 교환권을 선물로 보내드려요!<br><span style="font-size:12px;color:#999">(합격 인증 사진 함께 첨부)</span></p></div>'
   +'</div></div>';
}

/* ───────── 화면 전환 ───────── */
function show(view){
  document.querySelector('.hero').classList.toggle('hidden', view!=='cat');
  document.getElementById('view-cat').classList.toggle('hidden', view!=='cat');
  document.getElementById('view-type').classList.toggle('hidden', view!=='type');
  document.getElementById('view-detail').classList.toggle('hidden', view!=='detail');
  window.scrollTo(0,0);
}

function currentView(){
  if(curType) return 'detail';
  if(curCat) return 'type';
  return 'cat';
}

function draw(){
  if(curCat) renderTypes();
  renderDetail();
  show(currentView());
}

function makeUrl(){
  var p=new URLSearchParams(window.location.search);
  p.delete('cat'); p.delete('type');
  if(curType) p.set('type',curType);
  else if(curCat) p.set('cat',curCat);
  var q=p.toString();
  return window.location.pathname+(q?'?'+q:'');
}

var depth=0; // 이 페이지 안에서 앞으로 이동한 횟수
function push(){
  depth++;
  try{ history.pushState({cat:curCat,type:curType,depth:depth},'',makeUrl()); }catch(e){}
}

function selectCat(key){
  curCat=key;
  var cat=getCat(key);
  curType = cat.types.length===1 ? cat.types[0] : null;
  push(); draw();
}

function selectType(key){
  curType=key;
  push(); draw();
}

function goBack(){
  // 휴대폰 뒤로가기와 동일하게 동작
  if(depth>0){ history.back(); return; }
  if(curType && getCat(curCat).types.length>1){ curType=null; }
  else { curType=null; curCat=null; }
  try{ history.replaceState({cat:curCat,type:curType,depth:0},'',makeUrl()); }catch(e){}
  draw();
}

function goHome(){
  curCat=null; curType=null;
  push(); draw();
}

window.addEventListener('popstate',function(e){
  var s=e.state||{};
  curCat=s.cat||null; curType=s.type||null; depth=s.depth||0;
  draw();
});

window.onload=function(){
  var p=new URLSearchParams(window.location.search);
  var name=p.get('name');
  if(name){
    document.getElementById('page-title').textContent=name+'님 필독사항';
    document.title=name+'님 필독사항';
  }
  var type=p.get('type'), cat=p.get('cat');
  if(type && TYPES[type]){ curType=type; curCat=catOf(type).key; }
  else if(cat && getCat(cat)){ curCat=cat; }
  try{ history.replaceState({cat:curCat,type:curType,depth:0},'',makeUrl()); }catch(e){}
  renderCats(); draw();
};
</script>
